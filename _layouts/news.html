---
layout: default
---
<article class="news-article">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.type %} • <span class="type">{{ page.type }}</span>{% endif %}
  </p>
  {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}
  <div class="content">
    {{ content }}
  </div>
</article>
